{% extends 'core/base.html' %}

{% block title %}Login - ExamVault Platform{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-25 text-primary p-3 rounded-circle d-inline-block mb-3">
                        <i data-lucide="lock" style="width: 32px; height: 32px;"></i>
                    </div>
                    <h3 class="text-white">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your PYQs & mock test dashboard</p>
                </div>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i data-lucide="user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-muted"><i data-lucide="key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                        Sign In <i data-lucide="arrow-right" class="ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                    <span class="text-muted small">Don't have an account?</span>
                    <a href="{% url 'register' %}" class="text-primary text-decoration-none small ms-1 fw-bold">Create Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
